name: Investment platform checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PORTAL_ENABLED: "false"
      SITE_URL: "https://alabbas.sa"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install frozen dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Investment simulation unit tests
        run: node --import tsx --test tests/invest-demo.test.ts
      - name: Public production build (portal stays off)
        run: npm run build
      - name: Public route smoke tests (including new sandbox)
        run: |
          npm start > /tmp/alabbas-server.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/en > /dev/null; then break; fi
            sleep 2
          done
          npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  mysql-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral_ci_only
          MYSQL_DATABASE: alabbas_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pephemeral_ci_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://root:ephemeral_ci_only@127.0.0.1:3306/alabbas_ci_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Run all additive migrations against disposable MySQL
        run: npx prisma migrate deploy
      - name: Verify no pending migrations
        run: npx prisma migrate status
